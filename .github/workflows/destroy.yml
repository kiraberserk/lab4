name: Destroy Infrastructure

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to destroy (devel or stage)'
        required: true
        default: 'devel'
        type: choice
        options:
          - devel
          - stage

jobs:
  destroy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.15.0

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Terraform init
        run: terraform -chdir=envs/${{ github.event.inputs.environment }} init      
      - name: Terraform destroy
        run: terraform -chdir=envs/${{ github.event.inputs.environment }} destroy -auto-approve
