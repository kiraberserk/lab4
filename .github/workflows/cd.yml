name: CD

on:
  push:
    branches: [devel, stage]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm install
      - run: npm run build

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Determine environment
        id: env
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/devel" ]]; then
            echo "name=devel" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/stage" ]]; then
            echo "name=stage" >> $GITHUB_OUTPUT
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.15.0

      - name: Terraform init
        run: terraform -chdir=envs/${{ steps.env.outputs.name }} init

      - name: Terraform apply
        run: terraform -chdir=envs/${{ steps.env.outputs.name }} apply -auto-approve



      - name: Sync build to S3
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BUCKET="practice-${{ steps.env.outputs.name }}-mysite-${ACCOUNT_ID}"
          aws s3 sync build/ s3://${BUCKET} --delete

      - name: Invalidate CloudFront
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          DIST_ID=$(aws cloudfront list-distributions --query "DistributionList.Items[?Tags.Items[?Key=='Environment'].Value=='${{ steps.env.outputs.name }}']].Id" --output text 2>/dev/null || echo "")
          if [ -z "$DIST_ID" ]; then
            echo "Could not find distribution, skipping invalidation"
          else
            aws cloudfront create-invalidation --distribution-id $DIST_ID --paths "/*"
          fi
